# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
modules:
  # Scripts for system setup
  - type: script
    scripts:
      - ensureautoupdates.sh
      - setupvicinae.sh
  
  # Proprietary modules - handled in 03-apps.yml with negativo17 fedora-multimedia
  # Note: DNF modules from proprietary-modules.yml are handled separately
  
  # Copy all system files
  - type: files
    files:
      - source: system/usr
        destination: /usr
      - source: system/etc
        destination: /etc
  
  # Copy Hyprland configuration files
  - type: files
    files:
      - source: system/hyprland
        destination: /
  
  # Brew setup to initialize Homebrew in the image
  - type: brew
    nofile-limits: true # increase nofile limits
    brew-analytics: false # disable telemetry