# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
modules:
  # Wayland packages (niri + DMS)
  - type: dnf
    repos:
      copr:
        enable:
          - scottames/ghostty
          - avengemedia/dms
          - washkinazy/wayland-wm-extras
    install:
      install-weak-deps: false
      packages:
        # Terminal
        - ghostty

        # Window manager and desktop shell
        - niri
        - dms

        # Wayland components
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - gtk4-layer-shell
        - xwayland-satellite

        # Nerd fonts (available from washkinazy/wayland-wm-extras)
        - nerd-fonts-jetbrainsmono
        - nerd-fonts-firacode
        - nerd-fonts-cascadiacode

        # Utilities
        - xdg-terminal-exec

  # uwsm (Universal Wayland Session Manager) is not packaged in Fedora; pull it
  # from the solopasha/hyprland COPR. Kept in its own module so the COPR is only
  # in scope for this single package and cannot shadow the Fedora niri/dms above.
  - type: dnf
    repos:
      copr:
        enable:
          - solopasha/hyprland
    install:
      install-weak-deps: false
      packages:
        - uwsm