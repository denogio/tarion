# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
modules:
  # Copy Rust binaries from cargo-builder stage
  - type: copy
    from: cargo-stage
    src: /usr/local/cargo/bin/matugen
    dest: /usr/bin/matugen

  - type: copy
    from: cargo-stage
    src: /usr/local/cargo/bin/satty
    dest: /usr/bin/satty