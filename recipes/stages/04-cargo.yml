name: cargo-stage
modules:
  # Copy Rust binaries from cargo-builder stage
  - type: copy
    from: cargo-stage
    src: /usr/local/cargo/bin/bluetui
    dest: /usr/bin/bluetui

  - type: copy
    from: cargo-stage
    src: /usr/local/cargo/bin/impala
    dest: /usr/bin/impala

  - type: copy
    from: cargo-stage
    src: /usr/local/cargo/bin/matugen
    dest: /usr/bin/matugen

  - type: copy
    from: cargo-stage
    src: /usr/local/cargo/bin/satty
    dest: /usr/bin/satty