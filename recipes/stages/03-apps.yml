# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
modules:
  # User applications and GUI packages
  - type: dnf
    repos:
      copr:
        enable:
          - scottames/vicinae
    install:
      install-weak-deps: false
      packages:
        # Launcher and wireless
        - vicinae
        - iwd
        
        # GNOME Keyring for password management
        - gnome-keyring
        - gnome-keyring-pam
        - seahorse
        
        # Icon themes
        - gnome-icon-theme
        - paper-icon-theme
        - breeze-icon-theme
        - papirus-icon-theme
        
        # Proprietary codecs and multimedia
        - libopenjph
        - heif-pixbuf-loader
        - ffmpegthumbnailer
        - rar
    
    replace:
      - from-repo: fedora
        packages:
          - old: OpenCL-ICD-Loader
            new: ocl-icd
  
  # Multimedia codecs from negativo17 fedora-multimedia repository
  - type: script
    scripts:
      - ensurenegativopresence.sh
  
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - libheif
        - libva
        - mesa-dri-drivers
        - gstreamer1-plugin-libav
        - mesa-libGL
        - libva-intel-media-driver
        - intel-gmmlib
        - intel-mediasdk
        - ffmpeg
        - libfdk-aac
        - gstreamer1-plugins-ugly
        - libavcodec
        - libavdevice
        - libavfilter
        - libavformat
        - libavutil
        - libpostproc
        - libswresample
        - libswscale
    replace:
      - from-repo: fedora-multimedia
        packages:
          - libheif
          - libva
          - mesa-dri-drivers
          - gstreamer1-plugin-libav
          - mesa-libGL
          - libva-intel-media-driver
          - intel-gmmlib
          - intel-mediasdk
          - old: ffmpeg-free
            new: ffmpeg
          - old: fdk-aac-free
            new: libfdk-aac
          - old: gstreamer1-plugins-ugly-free
            new: gstreamer1-plugins-ugly
          - old: libavcodec-free
            new: libavcodec
          - old: libavdevice-free
            new: libavdevice
          - old: libavfilter-free
            new: libavfilter
          - old: libavformat-free
            new: libavformat
          - old: libavutil-free
            new: libavutil
          - old: libpostproc-free
            new: libpostproc
          - old: libswresample-free
            new: libswresample
          - old: libswscale-free
            new: libswscale
  
  # Flatpak setup
  - type: default-flatpaks
    configurations:
      # System scope - install for all users on first boot
      - scope: system
        repo:
          title: Flathub (system)
        install:
          # Essential flatpaks - minimal set
          - com.github.tchx84.Flatseal       # Flatpak permissions manager
          - io.github.flattool.Warehouse       # Flatpak management GUI
          # Default browser - Tarion's preferred browser
          - org.chromium.Chromium            # Chromium web browser
        notify: true

      # User scope - optional user-preferred apps
      # Users can add their own flatpaks here
      - scope: user
        repo:
          title: Flathub
        install: []
        notify: false

      # GNOME Nightly - apps not yet on stable Flathub
      - scope: system
        repo:
          title: GNOME Nightly
          url: https://nightly.gnome.org/gnome-nightly.flatpakrepo
        install:
          - ca.andyholmes.Valent   # Phone integration backend for DMS Phone Connect
        notify: true