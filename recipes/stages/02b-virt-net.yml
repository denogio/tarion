# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
modules:
  # Docker CE from official Docker repo
  - type: dnf
    repos:
      files:
        - https://download.docker.com/linux/fedora/docker-ce.repo
    install:
      install-weak-deps: false
      packages:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin

  # Netbird from official repo. The upstream netbird.repo convenience URL now
  # 404s, so ship a local repo file (files/dnf/netbird.repo) and import the
  # signing key for the gpgcheck/repo_gpgcheck=1 repo.
  - type: dnf
    repos:
      files:
        - netbird.repo
      keys:
        - https://pkgs.netbird.io/yum/repodata/repomd.xml.key
    install:
      install-weak-deps: false
      packages:
        - netbird
        - netbird-ui

  # Virtualization and mobile emulation
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - qemu
        - qemu-user-static
        - waydroid