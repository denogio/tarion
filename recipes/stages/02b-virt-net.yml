# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
modules:
  # Docker CE from official Docker repo
  - type: dnf
    repos:
      files:
        - https://download.docker.com/linux/fedora/docker-ce.repo
    install:
      install-weak-deps: false
      packages:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin

  # Virtualization and mobile emulation
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - qemu
        - qemu-user-static
        - waydroid

  # NetBird mesh VPN (daemon + tray UI) from the upstream NetBird repo.
  # Installed via script rather than the dnf module because the netbird RPM's
  # %post scriptlet fails inside a container build; see the script for details.
  - type: script
    scripts:
      - installnetbird.sh
