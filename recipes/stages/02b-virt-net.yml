# yaml-language-server: $schema=https://schema.blue-build.org/module-stage-list-v1.json
modules:
  # Docker CE from official Docker repo
  - type: dnf
    repos:
      files:
        - https://download.docker.com/linux/fedora/docker-ce.repo
    install:
      install-weak-deps: false
      packages:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin

  # Netbird repo configuration (shipped locally; upstream .repo URL 404s).
  # Placed before the dnf module so the repo is available during build.
  - type: files
    files:
      - source: dnf/netbird.repo
        destination: /etc/yum.repos.d/netbird.repo

  # Netbird from official repo. Installed with --setopt=tsflags=noscripts
  # to skip the RPM %post scriptlet, which runs "netbird service start"
  # and fails inside the build container (no running systemd). The systemd
  # unit that %post would have created is generated manually below.
  - type: script
    snippets:
      - |
        rpm --import https://pkgs.netbird.io/yum/repodata/repomd.xml.key
        dnf install -y --setopt=tsflags=noscripts netbird netbird-ui

        # Create the systemd service unit that "netbird service install"
        # in the RPM %post would have generated.
        mkdir -p /etc/systemd/system
        cat > /etc/systemd/system/netbird.service <<'EOF'
        [Unit]
        Description=NetBird mesh network client
        ConditionFileIsExecutable=/usr/bin/netbird
        After=network.target syslog.target

        [Service]
        StartLimitInterval=5
        StartLimitBurst=10
        ExecStart=/usr/bin/netbird service run --log-level info --daemon-addr unix:///var/run/netbird.sock --log-file /var/log/netbird/client.log
        Restart=always
        RestartSec=5

        [Install]
        WantedBy=multi-user.target
        EOF

        # Enable the service by creating the wants symlink manually
        # (systemctl enable fails in build containers without running systemd).
        mkdir -p /etc/systemd/system/multi-user.target.wants
        ln -sf /etc/systemd/system/netbird.service \
          /etc/systemd/system/multi-user.target.wants/netbird.service

  # Virtualization and mobile emulation
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - qemu
        - qemu-user-static
        - waydroid