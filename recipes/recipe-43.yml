---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: tarion
# description will be included in the image's metadata
description: tarion - the opinionated ublue distro with Niri

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
image-version: 43 # latest is also supported if you want new updates ASAP

platforms:
  - linux/amd64

# Define build stages - for building Rust binaries
stages:
  - from-file: stages/cargo-builder.yml  # Rust binaries build stage

# Define modules - optimized for layer caching
modules:
  - from-file: stages/00-base.yml        # Kernel and system packages
  - from-file: stages/01-desktop-core.yml # Niri and DMS
  - from-file: stages/02-tools.yml        # Developer tools
  - from-file: stages/02b-virt-net.yml   # Virtualization and networking (Docker, Netbird)
  - from-file: stages/03-apps.yml         # User applications
  - from-file: stages/04-cargo.yml        # Rust binaries copy
  - from-file: stages/05-config.yml       # Files and configurations
  - from-file: stages/06-services.yml     # Systemd services and final setup