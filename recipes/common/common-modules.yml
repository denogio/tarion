modules:
    # Containerfile snippets er flyttet til 01-stable-packages.yml
    # Alle DNF-pakker er flyttet til 01-stable-packages.yml

    - type: script
      scripts:
        - ensureautoupdates.sh

    - from-file: common/proprietary-modules.yml

    - type: files
      files:
        - source: system/usr
          destination: /usr
        - source: system/etc
          destination: /etc
