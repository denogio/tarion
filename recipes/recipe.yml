---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: tarion
# description will be included in the image's metadata
description: tarion - the opinionated ublue hyprland distro

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
image-version: 43 # latest is also supported if you want new updates ASAP

platforms:
  - linux/amd64

# Definer stadiet her
stages:
  - from-file: stages/cargo-builder.yml

modules:
  # 01: Alle DNF-pakker konsolideret i ét stabilt lag
  - from-file: common/01-stable-packages.yml
  
  # 02: Rust binaries fra cargo-stage
  - from-file: common/cargo-binaries.yml
  
  # 03: Scripts og systemkonfigurationer
  - from-file: common/greetd-modules.yml  # Kun systemd-delen
  - from-file: common/common-modules.yml  # Kun scripts og files
  - from-file: common/hyprland-modules.yml  # Kun files-delen
  - from-file: common/developer-tools.yml  # Kun files-delen
  - from-file: common/flatpak-modules.yml
  - from-file: common/extra-packages.yml  # Kun brew, files og systemd
  - from-file: common/final-modules.yml
