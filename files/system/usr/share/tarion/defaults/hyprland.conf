# Tarion system defaults for Hyprland
# These are the default configurations
# User configs will source this file and then add their own overrides

# Source system default modules
source = /usr/share/tarion/defaults/hypr/envs.conf
source = /usr/share/tarion/defaults/hypr/autostart.conf
source = /usr/share/tarion/defaults/hypr/input.conf
source = /usr/share/tarion/defaults/hypr/looknfeel.conf
source = /usr/share/tarion/defaults/hypr/windows.conf
# Note: bindings.conf was deprecated and removed - bindings are now in individual files
source = /usr/share/tarion/defaults/hypr/bindings/apps.conf
source = /usr/share/tarion/defaults/hypr/bindings/media.conf
source = /usr/share/tarion/defaults/hypr/bindings/tiling-v2.conf
source = /usr/share/tarion/defaults/hypr/bindings/scrolling.conf
source = /usr/share/tarion/defaults/hypr/bindings/utilities.conf
source = /usr/share/tarion/defaults/hypr/bindings/clipboard.conf

# User window rules (optional — create ~/.config/hypr/windowrules.conf to add your own)
source = ?~/.config/hypr/windowrules.conf

