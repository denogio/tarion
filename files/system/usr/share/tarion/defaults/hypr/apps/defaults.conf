# Default Applications for Tarion
$terminal = ghostty
$fileManager = ghostty -e superfile
$browser = chromium-browser
$music = amberol
$messenger = thunderbird
$passwordManager = bitwarden
$menu = vicinae
$yazi = ghostty -e yazi

# Keybindings for specific file managers
bindd = SUPER SHIFT, F, File manager (Superfile), exec, $fileManager
# Note: Removed SUPER ALT, F (Yazi) - conflicted with full width in tiling-v2.conf
# Users can launch Yazi from terminal or add custom binding
