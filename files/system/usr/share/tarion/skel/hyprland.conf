# Tarion system defaults for Hyprland
# These are the default configurations
# User configs will source this file and then add their own overrides

# Source system default modules
source = hypr/envs.conf
source = hypr/autostart.conf
source = hypr/input.conf
source = hypr/looknfeel.conf
source = hypr/windows.conf
# Note: bindings.conf was deprecated and removed - bindings are now in individual files
source = hypr/bindings/apps.conf
source = hypr/bindings/media.conf
source = hypr/bindings/tiling-v2.conf
source = hypr/bindings/scrolling.conf
source = hypr/bindings/utilities.conf
source = hypr/bindings/clipboard.conf
