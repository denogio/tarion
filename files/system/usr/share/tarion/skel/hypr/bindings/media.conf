# Volume controls using DMS IPC
bindeld = ,XF86AudioRaiseVolume, Volume up, exec, dms ipc call volume up
bindeld = ,XF86AudioLowerVolume, Volume down, exec, dms ipc call volume down
bindeld = ,XF86AudioMute, Mute, exec, dms ipc call volume mute-toggle
bindeld = ,XF86AudioMicMute, Mute microphone, exec, dms ipc call microphone mute-toggle

# Brightness controls using DMS IPC
bindeld = ,XF86MonBrightnessUp, Brightness up, exec, dms ipc call brightness up
bindeld = ,XF86MonBrightnessDown, Brightness down, exec, dms ipc call brightness down

# Precise 1% multimedia adjustments with Alt modifier
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, dms ipc call volume up-precise
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, dms ipc call volume down-precise
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, dms ipc call brightness up-precise
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, dms ipc call brightness down-precise

# Media player controls using playerctl
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPause, Pause, exec, playerctl play-pause
bindld = , XF86AudioPlay, Play, exec, playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous

# Switch audio output with Super + Mute
bindld = SUPER, XF86AudioMute, Switch audio output, exec, tarion-cmd-audio-switch
