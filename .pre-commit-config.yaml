repos:
  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck
        entry: ./scripts/lint-shell.sh
        language: script
        files: \.sh$
        pass_filenames: false
        always_run: true

      - id: niri-validation
        name: niri Configuration Validation
        entry: ./scripts/validate-niri.sh
        language: script
        files: \.kdl$
        pass_filenames: false
        always_run: true